<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SI-WARGA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen px-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full">
        <div class="text-center mb-6">
            <span class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Sistem Informasi Warga</span>
            <h2 class="text-2xl font-bold text-slate-800 mt-2">SI-WARGA</h2>
        </div>

        <!-- Tab Switcher -->
        <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-xl mb-6 text-sm font-semibold">
            <button type="button" id="tabWarga" onclick="switchMode('warga')" class="py-2 rounded-lg bg-white text-blue-700 shadow-sm transition">Warga</button>
            <button type="button" id="tabAdmin" onclick="switchMode('admin')" class="py-2 rounded-lg text-slate-500 hover:text-slate-700 transition">Pengurus / Admin</button>
        </div>

        <!-- Form Login Warga -->
        <form id="formLoginWarga" onsubmit="loginWarga(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">NIK (16 Digit)</label>
                <input type="text" name="nik" required placeholder="Masukkan NIK Anda" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:border-blue-600">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:border-blue-600">
            </div>
            <button type="submit" id="btnLoginWarga" class="w-full bg-blue-700 hover:bg-blue-800 disabled:bg-slate-400 text-white font-semibold py-2.5 rounded-lg shadow transition">
                Masuk sebagai Warga
            </button>
            <p class="text-sm text-center text-slate-600 pt-2">Belum terdaftar? <a href="index.html" class="text-blue-600 font-semibold hover:underline">Registrasi Warga Baru</a></p>
        </form>

        <!-- Form Login Admin -->
        <form id="formLoginAdmin" onsubmit="loginAdmin(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Username Admin</label>
                <input type="text" name="username" required placeholder="admin" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:border-slate-800">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password Admin</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:outline-none focus:border-slate-800">
            </div>
            <button type="submit" id="btnLoginAdmin" class="w-full bg-slate-800 hover:bg-slate-900 disabled:bg-slate-400 text-white font-semibold py-2.5 rounded-lg shadow transition">
                Masuk Panel Admin
            </button>
        </form>
    </div>

    <script>
        function switchMode(mode) {
            const formWarga = document.getElementById('formLoginWarga');
            const formAdmin = document.getElementById('formLoginAdmin');
            const tabWarga = document.getElementById('tabWarga');
            const tabAdmin = document.getElementById('tabAdmin');

            if (mode === 'warga') {
                formWarga.classList.remove('hidden');
                formAdmin.classList.add('hidden');
                tabWarga.className = "py-2 rounded-lg bg-white text-blue-700 shadow-sm transition";
                tabAdmin.className = "py-2 rounded-lg text-slate-500 hover:text-slate-700 transition";
            } else {
                formWarga.classList.add('hidden');
                formAdmin.classList.remove('hidden');
                tabAdmin.className = "py-2 rounded-lg bg-white text-slate-900 shadow-sm transition";
                tabWarga.className = "py-2 rounded-lg text-slate-500 hover:text-slate-700 transition";
            }
        }

        function loginWarga(e) {
            e.preventDefault();
            const form = e.target;
            const btn = document.getElementById('btnLoginWarga');
            btn.disabled = true;
            btn.innerText = "Memverifikasi...";

            const data = {
                action: 'login',
                nik: form.nik.value.trim(),
                password: form.password.value
            };

            fetch(CONFIG.SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) })
            .then(res => res.json())
            .then(res => {
                if (res.result === 'success') {
                    localStorage.setItem('si_warga_user', JSON.stringify(res.user));
                    window.location.href = 'dashboard.html';
                } else {
                    alert(res.message || "NIK atau Password salah.");
                    btn.disabled = false;
                    btn.innerText = "Masuk sebagai Warga";
                }
            })
            .catch(() => {
                alert("Terjadi kesalahan koneksi server.");
                btn.disabled = false;
                btn.innerText = "Masuk sebagai Warga";
            });
        }

        function loginAdmin(e) {
            e.preventDefault();
            const form = e.target;
            const btn = document.getElementById('btnLoginAdmin');
            btn.disabled = true;
            btn.innerText = "Memverifikasi Admin...";

            const data = {
                action: 'login_admin',
                username: form.username.value.trim(),
                password: form.password.value
            };

            fetch(CONFIG.SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) })
            .then(res => res.json())
            .then(res => {
                if (res.result === 'success') {
                    localStorage.setItem('si_warga_admin', 'true');
                    window.location.href = 'laporan_admin.html';
                } else {
                    alert(res.message || "Username atau Password Admin salah.");
                    btn.disabled = false;
                    btn.innerText = "Masuk Panel Admin";
                }
            })
            .catch(() => {
                alert("Terjadi kesalahan koneksi server.");
                btn.disabled = false;
                btn.innerText = "Masuk Panel Admin";
            });
        }
    </script>
</body>
</html>
